<!DOCTYPE html>
<html>
<head>
    <title>Activity 4 - Audio</title>
    <link rel="icon" href="hoy.jpg" type="image/jpg">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a84c;
            --dark-gold: #8b6914;
            --green: #3a5a2a;
            --dark-green: #1e3318;
            --cream: #d4c5a0;
            --bg-dark: #0d0b08;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Oswald', sans-serif;
            color: var(--cream);
            background: var(--bg-dark);
            min-height: 100vh;
        }

        /* WALL TEXTURE OVERLAY */
        body::after {
            content: '';
            position: fixed; inset: 0; z-index: -1;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(201,168,76,0.03) 40px, rgba(201,168,76,0.03) 41px),
                repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(201,168,76,0.03) 40px, rgba(201,168,76,0.03) 41px);
            pointer-events: none;
        }

        /* NAV */
        nav {
            position: sticky; top: 0; z-index: 999;
            background: rgba(13,11,8,0.96); backdrop-filter: blur(10px);
            display: flex; gap: 6px; padding: 12px 20px;
            flex-wrap: wrap;
            border-bottom: 2px solid var(--gold);
            box-shadow: 0 2px 20px rgba(201,168,76,0.15);
        }
        nav::before {
            content: '⚔';
            color: var(--gold);
            font-size: 18px;
            display: flex;
            align-items: center;
            margin-right: 6px;
        }
        nav a {
            color: var(--gold); text-decoration: none; font-size: 13px;
            font-weight: bold; padding: 6px 16px;
            border: 1px solid rgba(201,168,76,0.4); border-radius: 4px;
            letter-spacing: 1px; text-transform: uppercase;
            transition: background 0.3s, color 0.3s, box-shadow 0.3s;
            font-family: 'Oswald', sans-serif;
        }
        nav a:hover {
            background: var(--gold); color: var(--bg-dark);
            box-shadow: 0 0 12px rgba(201,168,76,0.5);
        }

        /* MAIN CONTENT */
        .main-content {
            background: url('hoy.jpg') no-repeat center center / cover;
            min-height: 100vh;
            position: relative; padding: 60px 40px;
        }
        .main-content::before {
            content: ''; position: absolute; inset: 0;
            background: rgba(8,6,4,0.75);
            pointer-events: none;
        }
        .playlist-bar {
            overflow: hidden; white-space: nowrap; padding: 14px 0; margin-bottom: 40px;
            border-top: 1px solid rgba(201,168,76,0.3);
            border-bottom: 1px solid rgba(201,168,76,0.3);
            position: relative;
        }
        .scroll-text {
            display: inline-block; color: var(--gold); font-size: 16px;
            font-weight: bold; padding-left: 100%;
            animation: scrolling 22s linear infinite;
            text-shadow: 0 0 8px rgba(201,168,76,0.6);
            letter-spacing: 2px; text-transform: uppercase;
            font-family: 'Oswald', sans-serif;
        }
        @keyframes scrolling { 0% { transform: translateX(0%); } 100% { transform: translateX(-100%); } }
        .audio-box { 
            text-align: center; 
            position: relative;
            max-width: 800px;
            margin: 0 auto;
        }
        .soft2-title {
            font-family: 'Bebas Neue', cursive;
            font-size: 42px; color: var(--cream); margin-bottom: 8px;
            letter-spacing: 4px;
            transition: color 0.3s; cursor: default;
        }
        .soft2-title:hover { color: var(--gold); }
        .audio-subtitle {
            font-size: 12px; letter-spacing: 4px; color: rgba(201,168,76,0.6);
            text-transform: uppercase; margin-bottom: 24px;
        }
        audio {
            filter: sepia(0.3) hue-rotate(20deg);
            border-radius: 4px;
            width: 100%;
            max-width: 500px;
        }
        .gif-row { 
            display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 24px; 
        }
        .gif { 
            width: 44px; height: 44px; border-radius: 50%; 
            border: 1px solid rgba(201,168,76,0.4); 
        }
        .gif-label {
            color: var(--cream); font-size: 16px; font-weight: bold;
            letter-spacing: 2px; font-family: 'Oswald', sans-serif;
        }
    </style>
</head>
<body>

<nav>
    <a href="#audio">🎵 ACT 4 </a>
</nav>

<div class="main-content">
    <div class="playlist-bar">
        <div class="scroll-text">⚔ Hiroyuki Sawano "Attack on Titan" • AOT Album • Survey Corps Radio • Beyond the Walls ⚔</div>
    </div>
    
    <div class="audio-box" id="audio">
        <h2 class="soft2-title">AOT ALBUM</h2>
        <p class="audio-subtitle">— Survey Corps Radio —</p>
        <audio controls>
            <source src="armin.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        
        <div class="gif-row">
            <img class="gif" src="ABSLALA.gif" alt="ABSLALA gif">
            <span class="gif-label">ATTACK ON TITAN</span>
            <img class="gif" src="ABSLALA.gif" alt="ABSLALA gif">
        </div>
    </div>
</div>

</body>
</html>
